{% extends "base.html" %}

{% block title %}Nueva contrasena | Postres{% endblock %}
{% block page_title %}Nueva contrasena{% endblock %}

{% block content %}
<div class="auth-panel">
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100" type="submit">
                <i class="bi bi-check2-circle" aria-hidden="true"></i>
                Guardar contrasena
            </button>
        </form>
    {% else %}
        <div class="alert alert-warning mb-0">El enlace no es valido o ya fue utilizado.</div>
    {% endif %}
</div>
{% endblock %}
