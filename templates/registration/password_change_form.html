{% extends "base.html" %}

{% block title %}Cambiar contrasena | Postres{% endblock %}
{% block page_title %}Cambiar contrasena{% endblock %}

{% block content %}
<div class="auth-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-key" aria-hidden="true"></i>
            Cambiar contrasena
        </button>
    </form>
</div>
{% endblock %}
